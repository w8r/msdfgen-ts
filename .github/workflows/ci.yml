name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs also execute verify-golden-regen (e.g. on a branch that
  # touches fixtures or the reference build, before it reaches main).
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── M0-M5 gates: test infra, parser, distance, MSDF golden, atlas, e2e ──────
  # Fixtures/fonts are committed, but gate:m2b/gate:m3 compare against the
  # live msdfgen binary (built once, then cached).
  # gate:m5 (test/e2e.test.ts) needs headless Chromium; if the install step
  # is ever skipped/fails, the test itself loud-skips rather than failing
  # (see test/e2e.test.ts's launchOrSkip) — never silently green either way.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Format check (oxfmt) and lint (oxlint)
        run: npm run format:check && npm run lint

      # gate:m2b/gate:m3 diff against the live reference binary — without it
      # those suites can't run (they fail loudly when CI is set). Same cache
      # key as verify-golden-regen, so the two jobs share one build.
      - name: Cache msdfgen binary
        id: cache-msdfgen
        uses: actions/cache@v6
        with:
          path: tools/msdfgen-ref
          key: msdfgen-ref-e06c7eaaaa071445ec77a1d73f942889f796b70b

      - name: Install msdfgen build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libfreetype-dev libpng-dev

      - name: Build msdfgen reference binary
        if: steps.cache-msdfgen.outputs.cache-hit != 'true'
        run: bash tools/setup-reference.sh

      - name: Install headless Chromium (for gate:m5's e2e check)
        run: npx playwright install --with-deps chromium

      - name: gate:all (m0-m5)
        run: npm run gate:all

  # ── Verify committed fixtures still match the pinned reference binary ───────
  # Runs on pushes to main and manual dispatch (not every PR) to keep CI fast.
  verify-golden-regen:
    runs-on: ubuntu-latest
    needs: gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7

      - name: Cache msdfgen binary
        id: cache-msdfgen
        uses: actions/cache@v6
        with:
          path: tools/msdfgen-ref
          key: msdfgen-ref-e06c7eaaaa071445ec77a1d73f942889f796b70b

      - name: Install build dependencies
        # `apt-get update` first: the runner's package index can lag behind
        # the mirror (seen as 404s on already-listed package versions,
        # e.g. bzip2-doc/libbz2-dev) — refreshing it before install avoids
        # that class of transient CI flake.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libfreetype-dev libpng-dev

      - name: Build msdfgen reference binary
        if: steps.cache-msdfgen.outputs.cache-hit != 'true'
        run: bash tools/setup-reference.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # Regenerate every bitmap with the pinned reference binary and compare
      # against the committed fixtures: shape.txt exactly, bitmaps within the
      # 1e-4 golden tolerance (macOS-generated fixtures vs Linux libm — see
      # tools/check-golden-regen.ts). Committed fonts are kept: re-downloading
      # from upstream could silently pick up a newer font version.
      - name: Regenerate golden fixtures and compare against committed
        run: |
          cp -R test/golden "$RUNNER_TEMP/golden-committed"
          find test/golden -name bitmap.fl32 -delete
          npx tsx tools/gen-golden.ts
          npx tsx tools/check-golden-regen.ts "$RUNNER_TEMP/golden-committed" test/golden

      - name: gate:m0 (post-regen)
        run: npm run gate:m0
