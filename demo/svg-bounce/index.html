<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>msdfgen-ts: 10,000 SVGs</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1117;
        color: #f4ecdb;
        font:
          13px/1.5 system-ui,
          sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #root {
        position: fixed;
        left: 16px;
        top: 12px;
        padding: 8px 12px;
        background: #0f1117cc;
        border-radius: 6px;
      }
      a {
        color: inherit;
      }
      #atlas {
        position: fixed;
        right: 16px;
        bottom: 16px;
        height: auto;
        outline: 1px solid #f4ecdb44;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="root">
      <div id="status"></div>
      <div>
        Drag to pan · wheel, pinch or double-click to zoom · arrows/WASD · 0 to reset · space to
        pause
      </div>
      <button id="pause">Pause</button>
      <select id="sample"></select>
      <select id="res" title="MSDF texels per viewBox height">
        <option>32</option>
        <option selected>64</option>
        <option>128</option>
        <option>256</option>
        <option>512</option>
      </select>
      px/em
      <input id="file" type="file" accept=".svg,image/svg+xml" /> ·
      <a href="../svg/index.html">single SVG</a> · <a href="../">all demos</a>
    </div>
    <canvas id="atlas"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
