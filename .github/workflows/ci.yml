name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── M0: test infrastructure ─────────────────────────────────────────────────
  gate-m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # The golden fixtures are committed to the repo, so gate:m0 runs
      # without needing to rebuild msdfgen in CI.
      # (msdfgen is only needed when regenerating fixtures deliberately.)
      - name: gate:m0
        run: npm run gate:m0

  # ── Optional: verify fixtures can be regenerated from source ────────────────
  # This job runs only on pushes to main (not every PR) to keep CI fast.
  verify-golden-regen:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Cache msdfgen binary
        id: cache-msdfgen
        uses: actions/cache@v4
        with:
          path: tools/msdfgen-ref
          key: msdfgen-ref-e06c7eaaaa071445ec77a1d73f942889f796b70b

      - name: Install build dependencies
        run: sudo apt-get install -y cmake libfreetype-dev libpng-dev

      - name: Build msdfgen reference binary
        if: steps.cache-msdfgen.outputs.cache-hit != 'true'
        run: bash tools/setup-reference.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Regenerate golden fixtures
        run: node tools/gen-golden.mjs

      - name: gate:m0 (post-regen)
        run: npm run gate:m0
