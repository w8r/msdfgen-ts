<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>msdfgen-ts: three.js</title>
    <style>
      :root[data-theme="dark"] {
        --bg: #0f1117;
        --fg: #f4ecdb;
        --muted: #8b8f99;
      }
      :root[data-theme="light"] {
        --bg: #f4ecdb;
        --fg: #1b1d24;
        --muted: #5b5f69;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--muted);
        font:
          13px/1.5 system-ui,
          sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .controls {
        position: fixed;
        top: 16px;
        left: 20px;
        right: 20px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      input[type="text"] {
        flex: 1;
        min-width: 180px;
        max-width: 360px;
        padding: 6px 10px;
        font:
          14px system-ui,
          sans-serif;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--muted);
        border-radius: 6px;
      }
      button {
        font: inherit;
        color: var(--fg);
        background: none;
        border: 1px solid var(--muted);
        border-radius: 999px;
        padding: 4px 12px;
        cursor: pointer;
      }
      footer {
        position: fixed;
        left: 20px;
        bottom: 16px;
        margin: 0;
      }
      a {
        color: var(--fg);
        text-decoration: none;
        border-bottom: 1px solid var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <input id="input" type="text" value="Type new glyphs: ƒ ő Ж" aria-label="Text" />
      <button id="theme" type="button">Light / dark</button>
    </div>
    <footer>
      msdfgen-ts · three.js (WebGL2) · drag to orbit, wheel to fly into the glyphs ·
      <a href="https://github.com/w8r/msdfgen-ts/tree/main/demo/three">source</a> ·
      <a href="../">all demos</a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
