name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── M0-M5 gates: test infra, parser, distance, MSDF golden, atlas, e2e ──────
  # Fixtures/fonts are committed, so this runs without rebuilding msdfgen.
  # gate:m5 (test/e2e.test.ts) needs headless Chromium; if the install step
  # is ever skipped/fails, the test itself loud-skips rather than failing
  # (see test/e2e.test.ts's launchOrSkip) — never silently green either way.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install headless Chromium (for gate:m5's e2e check)
        run: npx playwright install --with-deps chromium

      - name: gate:all (m0-m5)
        run: npm run gate:all

  # ── Optional: verify fixtures can be regenerated from source ────────────────
  # This job runs only on pushes to main (not every PR) to keep CI fast.
  verify-golden-regen:
    runs-on: ubuntu-latest
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Cache msdfgen binary
        id: cache-msdfgen
        uses: actions/cache@v6
        with:
          path: tools/msdfgen-ref
          key: msdfgen-ref-e06c7eaaaa071445ec77a1d73f942889f796b70b

      - name: Install build dependencies
        # `apt-get update` first: the runner's package index can lag behind
        # the mirror (seen as 404s on already-listed package versions,
        # e.g. bzip2-doc/libbz2-dev) — refreshing it before install avoids
        # that class of transient CI flake.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libfreetype-dev libpng-dev

      - name: Build msdfgen reference binary
        if: steps.cache-msdfgen.outputs.cache-hit != 'true'
        run: bash tools/setup-reference.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Regenerate golden fixtures (wipe committed artifacts first)
        run: |
          rm -rf test/golden test/fonts
          node tools/gen-golden.mjs

      - name: gate:m0 (post-regen)
        run: npm run gate:m0
